name: Backend CI

# Compiles and tests backend/college on every push/PR that touches it. Requires a live
# PostgreSQL instance (see CLAUDE.md / application.yaml) — spun up here as a service container.
# NOTE: not run end-to-end against GitHub Actions before landing this file; if the Flyway/RLS
# bootstrap (V017 creating the erp_app role) doesn't come up cleanly against the postgres:16
# service image, check the Actions log against application.yaml's spring.datasource/spring.flyway
# section before assuming the app code itself regressed.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend/college

jobs:
  build-and-test:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Matches application.yaml's spring.flyway.* defaults (FLYWAY_DB_USERNAME/PASSWORD) —
          # Flyway connects as this superuser to run migrations, including V017's `CREATE ROLE
          # erp_app`. The app's own runtime datasource then connects as that least-privilege
          # erp_app role, matching spring.datasource.* defaults.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: college_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/college/pom.xml

      - name: Compile
        run: ./mvnw -B compile

      - name: Run tests
        run: ./mvnw -B test
        env:
          # Defaults in application.yaml already point at localhost:5432/college_erp with these
          # same credentials — set explicitly here so the workflow doesn't silently depend on
          # those defaults never changing.
          DB_URL: jdbc:postgresql://localhost:5432/college_erp
          DB_USERNAME: erp_app
          DB_PASSWORD: "ErpApp@2026"
          FLYWAY_DB_URL: jdbc:postgresql://localhost:5432/college_erp
          FLYWAY_DB_USERNAME: postgres
          FLYWAY_DB_PASSWORD: admin

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/college/target/surefire-reports
          retention-days: 7

      # Checkstyle/SpotBugs are not yet configured in pom.xml (see CLAUDE.md's Build progress
      # table) — add `./mvnw -B checkstyle:check` / `./mvnw -B spotbugs:check` steps here once
      # those plugins are actually wired up, per 07-coding-standards.md.
