name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    name: Lint & build (Node LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # No test script is defined in frontend/package.json yet (see CLAUDE.md — the frontend is
      # newly scaffolded). Add a `npm test` step here once Vitest + React Testing Library tests
      # exist, per 07-coding-standards.md §16.2.
