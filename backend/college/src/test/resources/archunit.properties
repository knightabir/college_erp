# This machine runs JDK 26, ahead of what ArchUnit's bundled ASM officially supports for reading
# JDK runtime classes off the module system (jrt:/java.base/java/lang/Integer.class fails with
# "Unsupported class file major version 70") — the same "JDK 26 ahead of tooling support" pattern
# as Lombok/Mockito elsewhere in this project (see CLAUDE.md). Disabling eager resolution of
# missing dependency classes from the classpath avoids ArchUnit ever trying to read those JDK
# class files in the first place; ModuleBoundaryTest's rules only need application classes'
# direct dependencies, not full JDK type hierarchies. Safe to drop once ArchUnit ships a release
# whose bundled ASM recognizes this JDK's class file version.
archunit.resolveMissingDependenciesFromClassPath=false
